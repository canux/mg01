<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1220">
  <title>mg01 城堡争霸</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud-top">
      <div class="side side-left" id="hud-left">
        <span class="race-badge" id="race-left">人族</span>
        <span class="gold"><i>●</i><b id="gold-left">200</b></span>
        <span class="income" id="income-left">+10/10s</span>
      </div>
      <div class="center">
        <div class="timer"><span id="timer">0.0s</span> <span class="sep">/</span> <span id="timer-max">300s</span></div>
        <div class="phase" id="phase">Phase 0</div>
        <div class="speedbar" id="speedbar">
          <button data-rate="0"   title="暂停">⏸</button>
          <button data-rate="0.5">0.5x</button>
          <button data-rate="1" class="active">1x</button>
          <button data-rate="2">2x</button>
          <button data-rate="4">4x</button>
        </div>
      </div>
      <div class="side side-right" id="hud-right">
        <span class="race-badge" id="race-right">兽族</span>
        <span class="gold"><i>●</i><b id="gold-right">200</b></span>
        <span class="income" id="income-right">+10/10s</span>
      </div>
    </header>

    <div id="hero-bar">
      <button id="hero-left" class="hero-btn left" disabled>
        <span class="hero-name">—</span><span class="hero-sub">—</span>
      </button>
      <button id="hero-right" class="hero-btn right" disabled>
        <span class="hero-name">—</span><span class="hero-sub">—</span>
      </button>
    </div>

    <div id="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="banner" class="hidden">
        <div class="win-card">
          <div class="win-title" id="win-title">—</div>
          <div class="win-stats">
            <div class="win-col left">
              <div class="win-race" id="win-race-l">—</div>
              <div class="win-spawn"><b id="win-spawn-l">0</b> 造兵</div>
              <div class="win-gold"><b id="win-gold-l">0</b>g</div>
            </div>
            <div class="win-vs">VS</div>
            <div class="win-col right">
              <div class="win-race" id="win-race-r">—</div>
              <div class="win-spawn"><b id="win-spawn-r">0</b> 造兵</div>
              <div class="win-gold"><b id="win-gold-r">0</b>g</div>
            </div>
          </div>
          <button id="btn-rematch" class="primary">再来一局</button>
        </div>
      </div>
    </div>

    <footer id="hud-bottom">
      <div class="picker">
        <label>L</label>
        <select id="pick-left"></select>
        <select id="mode-left" class="mode">
          <option value="player">手玩</option>
          <option value="ai" selected>AI</option>
        </select>
      </div>
      <button id="btn-new" class="primary">新局</button>
      <div class="picker">
        <label>R</label>
        <select id="pick-right"></select>
        <select id="mode-right" class="mode">
          <option value="player">手玩</option>
          <option value="ai" selected>AI</option>
        </select>
      </div>
    </footer>

    <div id="log-panel" data-filter="all">
      <div id="log-tabs">
        <button class="active" data-kind="all">全部</button>
        <button data-kind="attack">攻击</button>
        <button data-kind="spell">法术</button>
        <button data-kind="death">死亡</button>
        <button data-kind="build">建造</button>
        <button data-kind="hero">英雄</button>
      </div>
      <ul id="log"></ul>
    </div>

    <div id="build-sheet" class="hidden">
      <div class="sheet-head">
        <span class="sheet-title">选择建造 (slot <b id="sheet-slot">?</b>)</span>
        <button class="sheet-close" id="sheet-close">×</button>
      </div>
      <ul id="sheet-list"></ul>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
